name: Deploy TVShop

on:
  push:
    branches:
      - main

concurrency:
  group: tvshop-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload TVShop application files
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='node_modules' \
            --exclude='backend/uploads' \
            --exclude='uploads' \
            --exclude='compose.yml' \
            --exclude='docker-compose.vps.yml' \
            --exclude='docker-compose.vps.yml.*' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/tvshop/app/"

      - name: Blue-green deploy TVShop
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -se' <<'EOF'
          set -Eeuo pipefail

          APP_DIR='/var/www/tvshop/app'
          NGINX_FILE='/etc/nginx/sites-enabled/tvshop.az'
          BACKUP_DIR='/var/www/tvshop/backups/deploy'
          COMPOSE=(docker compose -p tvshop -f docker-compose.vps.yml --env-file .env)

          cd "$APP_DIR"

          test -f .env || { echo 'ERROR: TVShop server .env is missing.'; exit 1; }
          test -f docker-compose.vps.yml || { echo 'ERROR: TVShop server compose file is missing.'; exit 1; }
          test -f "$NGINX_FILE" || { echo 'ERROR: TVShop Nginx site is missing.'; exit 1; }

          if sudo grep -Fq 'proxy_pass http://127.0.0.1:3003;' "$NGINX_FILE"; then
            LIVE_PORT=3003
            LIVE_SERVICE='app'
            CANDIDATE_PORT=3004
            CANDIDATE_SERVICE='app_green'
          elif sudo grep -Fq 'proxy_pass http://127.0.0.1:3004;' "$NGINX_FILE"; then
            LIVE_PORT=3004
            LIVE_SERVICE='app_green'
            CANDIDATE_PORT=3003
            CANDIDATE_SERVICE='app'
          else
            echo 'ERROR: Cannot determine the current TVShop live slot.'
            exit 1
          fi

          echo "Live port: $LIVE_PORT"
          echo "Candidate port: $CANDIDATE_PORT"
          echo "Candidate service: $CANDIDATE_SERVICE"

          echo 'Creating pre-deploy PostgreSQL backup...'
          umask 077
          mkdir -p "$BACKUP_DIR"
          BACKUP_FILE="$BACKUP_DIR/tvshop-$(date -u +%Y%m%dT%H%M%SZ).dump"
          docker exec tvshop-postgres-1 pg_dump -U tvshop -d tvshop -Fc > "$BACKUP_FILE"
          test -s "$BACKUP_FILE" || { echo 'ERROR: PostgreSQL backup is empty.'; exit 1; }

          echo 'Building only the non-live candidate...'
          "${COMPOSE[@]}" build "$CANDIDATE_SERVICE"
          "${COMPOSE[@]}" up -d --no-deps "$CANDIDATE_SERVICE"

          assert_local_binding() {
            local service="$1"
            local port="$2"
            local container
            local bindings
            container=$("${COMPOSE[@]}" ps -q "$service")
            test -n "$container" || { echo "ERROR: $service container is missing."; exit 1; }
            bindings=$(docker port "$container")
            if ! printf '%s\n' "$bindings" | grep -Eq "127\\.0\\.0\\.1:${port}$"; then
              echo "ERROR: $service is not bound to required localhost port $port."
              printf '%s\n' "$bindings"
              exit 1
            fi
            if printf '%s\n' "$bindings" | grep -Evq "127\\.0\\.0\\.1:${port}$"; then
              echo "ERROR: $service has a non-localhost port binding."
              exit 1
            fi
          }

          assert_local_binding "$LIVE_SERVICE" "$LIVE_PORT"
          assert_local_binding "$CANDIDATE_SERVICE" "$CANDIDATE_PORT"

          echo 'Waiting for candidate readiness...'
          READY=0
          for attempt in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:${CANDIDATE_PORT}/api/v1/ready" >/dev/null; then
              READY=1
              break
            fi
            echo "Readiness attempt $attempt/40..."
            sleep 3
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: Candidate failed readiness; live traffic remains on $LIVE_PORT."
            "${COMPOSE[@]}" logs --tail=150 "$CANDIDATE_SERVICE" || true
            exit 1
          fi

          restore_live_port() {
            sudo sed -i \
              "s#proxy_pass http://127.0.0.1:${CANDIDATE_PORT};#proxy_pass http://127.0.0.1:${LIVE_PORT};#" \
              "$NGINX_FILE"
            sudo nginx -t
            sudo systemctl reload nginx
          }

          echo 'Switching Nginx to the ready candidate...'
          sudo sed -i \
            "s#proxy_pass http://127.0.0.1:${LIVE_PORT};#proxy_pass http://127.0.0.1:${CANDIDATE_PORT};#" \
            "$NGINX_FILE"

          if ! sudo grep -Fq "proxy_pass http://127.0.0.1:${CANDIDATE_PORT};" "$NGINX_FILE"; then
            echo 'ERROR: Nginx upstream was not changed; restoring the previous live port.'
            restore_live_port
            exit 1
          fi

          if ! sudo nginx -t; then
            echo 'ERROR: Nginx validation failed; restoring the previous live port.'
            restore_live_port
            exit 1
          fi

          if ! sudo systemctl reload nginx; then
            echo 'ERROR: Nginx reload failed; restoring the previous live port.'
            restore_live_port
            exit 1
          fi

          echo 'Verifying TVShop over HTTPS...'
          if ! curl -fsS --retry 5 --retry-delay 2 --retry-connrefused \
            --resolve 'tvshop.az:443:127.0.0.1' \
            'https://tvshop.az/api/v1/ready' >/dev/null; then
            echo 'ERROR: HTTPS verification failed; restoring the previous live port.'
            restore_live_port
            exit 1
          fi

          echo "TVShop deploy succeeded on port $CANDIDATE_PORT."
          echo "Previous version remains available on port $LIVE_PORT."
          "${COMPOSE[@]}" ps
          EOF
