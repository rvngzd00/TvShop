services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tvshop
      POSTGRES_USER: tvshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tələb olunur}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tvshop -d tvshop"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN tələb olunur}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      DATABASE_URL: postgresql://tvshop:${POSTGRES_PASSWORD}@postgres:5432/tvshop
      DATABASE_SSL: ${DATABASE_SSL:-disable}
      DATABASE_SSL_REJECT_UNAUTHORIZED: ${DATABASE_SSL_REJECT_UNAUTHORIZED:-true}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET tələb olunur}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET tələb olunur}
      DEFAULT_STORE_CODE: ${DEFAULT_STORE_CODE:-daily-baku}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@tvshop.az}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD tələb olunur}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-disabled}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-TVShop <noreply@tvshop.az>}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-support@tvshop.az}
      EMAIL_TIMEOUT_MS: ${EMAIL_TIMEOUT_MS:-10000}
      TRUST_PROXY: "true"
      UPLOAD_DIR: /app/backend/uploads
    volumes:
      - uploads:/app/backend/uploads
    networks: [private, public]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN tələb olunur}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [public]

networks:
  private:
    internal: true
  public:

volumes:
  postgres_data:
  uploads:
  caddy_data:
  caddy_config:
